name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc points @hackpsu/* at HackPSU's public Artifact Registry; no credentials needed.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Builds without Firebase/API config: the app prerenders its setup screen.
      - run: npm run build
